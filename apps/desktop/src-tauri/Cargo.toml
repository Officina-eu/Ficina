[package]
name = "alomails-desktop"
version = "0.1.1"
description = "alomails desktop shell"
authors = ["aloworld"]
edition = "2021"

# Its own workspace: the desktop shell is a client (ADR 0005), deliberately kept
# out of the platform/products Cargo workspace so it carries its own lockfile and
# never entangles the server build.
[workspace]

[lib]
name = "alomails_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# The bundled UI reaches the alo API through the native HTTP client (requests
# issue from Rust, not the webview), so the app has no browser cross-origin/CORS
# constraints against the hosted server. See src/lib.rs.
tauri-plugin-http = "2"
# Silent auto-update: check a signed feed, download, verify the minisign
# signature against the baked-in public key, install, relaunch (see src/lib.rs).
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
