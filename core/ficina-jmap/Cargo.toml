[package]
name = "ficina-jmap"
description = "Ficina JMAP API (RFC 8620 core, RFC 8621 mail) over ficina-store"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
ficina-store = { path = "../ficina-store" }
ficina-sieve = { path = "../ficina-sieve" }
ficina-identity = { path = "../ficina-identity" }
# The shared outbound SMTP client — EmailSubmission/set sends through the
# trusted internal submission listener using the same production client the
# SMTP delivery path uses.
ficina-smtp-client = { path = "../ficina-smtp-client" }
# The AI inference layer (ADR 0011) — the /ai/improve route bridges to it.
ficina-ai = { path = "../ficina-ai" }
# Per-domain DKIM key generation when a domain is verified (ADR 0014).
ficina-auth-mail = { path = "../ficina-auth-mail" }
# Live DNS checks for the admin Security & trust page (SPF/DMARC/DKIM/MX/PTR).
hickory-resolver = { workspace = true }
# The MTA-STS policy fetch (HTTPS) in the Security & trust checks.
reqwest = { workspace = true }
tokio = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
axum = { workspace = true }
futures = { workspace = true }
time = { workspace = true }
bytes = { workspace = true }
# RFC 2047 encoded-words + base64 message bodies for outgoing mail.
base64 = { workspace = true }
# MIME parsing for inbound bodies + attachments (Email/get, download).
mail-parser = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
# In-process HTTP testing (drive the router without a socket) + a small
# test pool.
tower = { version = "0.5", features = ["util"] }
sqlx = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true
