# Back-port contributions from aloworld-org/alomails into this monorepo
# (ADR 0019 two-way sync). Thin caller of the reusable back-port workflow.
name: Back-port from alomails

on:
  schedule:
    - cron: "17 * * * *" # hourly; a no-op when there is nothing to back-port
  workflow_dispatch:

jobs:
  backport:
    uses: ./.github/workflows/backport-product.yml
    with:
      product: mail
      source_repo: aloworld-org/alomails
