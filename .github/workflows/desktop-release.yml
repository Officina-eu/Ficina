# Build + release the alomails desktop apps (ADR 0005 Tauri shell) for macOS +
# Windows. The app bundles the real web UI locally and talks to the hosted API
# over the native HTTP client — an installed program, not a window on the site.
#
# What a release does:
#   1. `build` (matrix, macOS + Windows): builds the bundled UI, then the Tauri
#      app + its SIGNED updater artifact, attaches installers to a draft GitHub
#      release, and uploads the installer + updater files as workflow artifacts.
#   2. `publish-feed`: assembles `latest.json` for ALL platforms and publishes it
#      — with the installers + updater packages — to our OWN server
#      (alomails.com/download), the sovereign update feed the apps poll. This is
#      what makes macOS (and Windows) auto-update without hosting on a third
#      party.
#
# Secrets (Settings → Secrets and variables → Actions):
#   TAURI_SIGNING_PRIVATE_KEY / _PASSWORD  — updater signing (already set).
#   ALO_DEPLOY_HOST  — e.g. root@<server-ip> (or, better, a scoped deploy user).
#   ALO_DEPLOY_KEY   — its SSH private key. Prefer a key RESTRICTED to the
#                      downloads dir (authorized_keys command=/chrooted sftp),
#                      NOT the root deploy key — CI should not hold root.
#   Apple (optional; enables macOS code-signing + notarization):
#     APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
#     APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID
#   Windows code-signing is configured separately (Azure Trusted Signing) — see
#   docs/desktop-signing.md.
#
# Trigger: push a `desktop-v*` tag (release), or run manually (workflow_dispatch).
name: Desktop apps

on:
  workflow_dispatch:
  push:
    tags: ["desktop-v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target universal-apple-darwin"
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # The desktop app bundles the real web UI (not a redirect stub). Build it
      # as the mail surface, pointed at the hosted API, and stage it where the
      # Tauri config expects it. `shell: bash` so the env syntax matches on both
      # runners.
      - name: Build + stage the bundled web UI
        shell: bash
        env:
          ALO_PRODUCT: mail
          VITE_API_BASE: https://mail.alomails.com
        run: |
          npm --prefix web ci
          npm --prefix web run build
          rm -rf apps/desktop/dist
          cp -r web/dist apps/desktop/dist

      - name: Build, sign, attach installers to a draft release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater signing — the app only accepts updates signed by this key.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Apple code-signing + notarization (macOS leg only; no-ops if unset).
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'desktop-latest' }}
          releaseName: "alomails desktop"
          releaseBody: "Install from https://alomails.com — the app keeps itself up to date."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      # Gather just the files the feed needs (installer + updater package + its
      # signature), whatever their exact versioned names, for the publish job.
      - name: Collect release artifacts
        shell: bash
        run: |
          mkdir -p _art
          find apps/desktop/src-tauri/target -type f \( \
              -name "*.app.tar.gz" -o -name "*.app.tar.gz.sig" \
              -o -name "*-setup.exe" -o -name "*-setup.exe.sig" \
              -o -name "*.dmg" \) -exec cp {} _art/ \;
          ls -la _art

      - uses: actions/upload-artifact@v4
        with:
          name: art-${{ matrix.platform }}
          path: _art/
          if-no-files-found: error

  publish-feed:
    needs: build
    runs-on: ubuntu-latest
    # Runs on a tag even if a build leg failed, so a platform that DID build
    # still publishes (the feed's latest.json is assembled from whatever
    # artifacts exist). This also makes the feed a diagnostic: which platforms
    # appear tells us which builds succeeded.
    if: ${{ always() && github.ref_type == 'tag' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: _in
          pattern: art-*
          merge-multiple: true
        continue-on-error: true

      - name: Assemble latest.json + stage the feed
        shell: bash
        run: |
          set -euo pipefail
          ver="$(grep -m1 '"version"' apps/desktop/src-tauri/tauri.conf.json | sed -E 's/.*"([0-9][^"]*)".*/\1/')"
          pub="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          base="https://mail.alomails.com/download"
          mkdir -p out
          find _in -type f -print

          # Locate each platform's files (globs tolerate the versioned names).
          winexe="$(find _in -name '*-setup.exe' | head -1)"
          winsig="$(find _in -name '*-setup.exe.sig' | head -1)"
          mactar="$(find _in -name '*.app.tar.gz' | head -1)"
          macsig="$(find _in -name '*.app.tar.gz.sig' | head -1)"
          macdmg="$(find _in -name '*.dmg' | head -1)"

          # Never overwrite a good feed with an empty one if nothing built.
          if [ -z "$winexe" ] && [ -z "$mactar" ]; then
            echo "No updater artifacts were produced — leaving the feed untouched."
            echo "SKIP_PUBLISH=1" >> "$GITHUB_ENV"
            exit 0
          fi

          # Stable-named installers for the download page + versioned updater
          # packages (the URLs referenced by latest.json).
          [ -n "$winexe" ] && cp "$winexe" "out/alomails-windows-x64-setup.exe" && cp "$winexe" "out/$(basename "$winexe")"
          [ -n "$macdmg" ] && cp "$macdmg" "out/alomails-mac-universal.dmg"
          [ -n "$mactar" ] && cp "$mactar" "out/$(basename "$mactar")"

          # Build the platforms map (bash + jq) from whatever this run produced.
          plats='{}'
          if [ -n "$winexe" ] && [ -n "$winsig" ]; then
            plats="$(jq -n --argjson p "$plats" --arg s "$(cat "$winsig")" \
              --arg u "$base/$(basename "$winexe")" \
              '$p + {"windows-x86_64":{signature:$s,url:$u}}')"
          fi
          if [ -n "$mactar" ] && [ -n "$macsig" ]; then
            e="$(jq -n --arg s "$(cat "$macsig")" --arg u "$base/$(basename "$mactar")" '{signature:$s,url:$u}')"
            plats="$(jq -n --argjson p "$plats" --argjson e "$e" \
              '$p + {"darwin-aarch64":$e,"darwin-x86_64":$e}')"
          fi
          jq -n --arg v "$ver" --arg p "$pub" --argjson plats "$plats" \
            '{version:$v, notes:"alomails desktop update.", pub_date:$p, platforms:$plats}' \
            > out/latest.json

          echo "=== latest.json ==="; cat out/latest.json
          ls -la out

      - name: Publish to the update feed
        if: ${{ env.SKIP_PUBLISH != '1' }}
        env:
          DEPLOY_HOST: ${{ secrets.ALO_DEPLOY_HOST }}
          DEPLOY_KEY: ${{ secrets.ALO_DEPLOY_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${DEPLOY_HOST:-}" ] || [ -z "${DEPLOY_KEY:-}" ]; then
            echo "ALO_DEPLOY_HOST / ALO_DEPLOY_KEY not set — skipping feed publish."
            echo "Artifacts are still attached to the draft GitHub release."
            exit 0
          fi
          printf '%s\n' "$DEPLOY_KEY" > key
          chmod 600 key
          scp -i key -o StrictHostKeyChecking=accept-new \
            out/* "${DEPLOY_HOST}:/opt/alo/deploy/production/downloads/"
          rm -f key
          echo "Published feed + installers to ${DEPLOY_HOST}:/opt/alo/deploy/production/downloads/"
