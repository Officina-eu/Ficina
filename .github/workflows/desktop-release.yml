# Build the alomails desktop apps (ADR 0005 Tauri shell) for macOS + Windows.
# The app bundles the real web UI locally and talks to the hosted API over the
# native HTTP client — an installed program, not a window pointed at the site.
#
# Windows can be built on a dev machine directly (`cargo tauri build`); the Mac
# .dmg must build on macOS, which is what the mac runner here is for. Both
# produce UNSIGNED installers for now — they install and run, but show the OS
# "unidentified developer" prompt until signing secrets are added (Apple
# Developer ID for macOS, a code-signing cert for Windows). Wire those in as
# repo secrets and this workflow signs automatically.
#
# Trigger manually (workflow_dispatch) or by pushing a `desktop-v*` tag. Note:
# macOS runners bill more Actions minutes on a private repo — run when needed.
name: Desktop apps

on:
  workflow_dispatch:
  push:
    tags: ["desktop-v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: universal-apple-darwin
            args: "--target universal-apple-darwin"
          - platform: windows-latest
            target: ""
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # The desktop app bundles the real web UI (not a redirect stub). Build it
      # as the mail surface, pointed at the hosted API, and stage it where the
      # Tauri config expects it (apps/desktop/dist). `shell: bash` so the env
      # syntax is identical on the Windows and macOS runners.
      - name: Build + stage the bundled web UI
        shell: bash
        env:
          ALO_PRODUCT: mail
          VITE_API_BASE: https://mail.alomails.com
        run: |
          npm --prefix web ci
          npm --prefix web run build
          rm -rf apps/desktop/dist
          cp -r web/dist apps/desktop/dist

      - name: Build + attach installers to a draft release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the updater artifacts so the app will accept them. Add these as
          # repo secrets (Settings → Secrets → Actions); the private key is the
          # updater key generated with `cargo tauri signer generate`, the
          # password is what it was generated with (empty here). Without them the
          # build still produces installers, just no self-update packages.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'desktop-latest' }}
          releaseName: "alomails desktop"
          releaseBody: "Download the installer for your platform. Unsigned for now — your OS may warn about an unidentified developer."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
