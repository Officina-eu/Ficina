# Publish the Mail product to aloworld-org/alomails (ADR 0019). Thin caller of
# the reusable publish-product workflow — the export logic is shared.
#
# ONE-TIME SETUP: a GitHub App installed on aloworld-org/alomails with
# Contents + Workflows: read & write, exposed here as two repo secrets:
#   ALOMAILS_APP_ID · ALOMAILS_APP_PRIVATE_KEY
name: Publish alomails

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  publish:
    uses: ./.github/workflows/publish-product.yml
    with:
      product: mail
      target_repo: aloworld-org/alomails
    secrets:
      app_id: ${{ secrets.ALOMAILS_APP_ID }}
      app_private_key: ${{ secrets.ALOMAILS_APP_PRIVATE_KEY }}
