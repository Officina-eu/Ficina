[package]
name = "alo-control"
description = "alo multi-tenant control plane: tenant lifecycle, domains, operators"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
alo-store = { path = "../core/alo-store" }
alo-identity = { path = "../core/alo-identity" }
# Per-domain DKIM key generation when a domain is verified (ADR 0014).
alo-auth-mail = { path = "../core/alo-auth-mail" }
# DNS TXT lookup to verify a tenant's domain ownership (same resolver the
# Security & trust checks use).
hickory-resolver = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
axum = { workspace = true }
time = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
tower = { version = "0.5", features = ["util"] }
serde_json = { workspace = true }

[lints]
workspace = true
