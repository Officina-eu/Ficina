[package]
name = "alo-sites"
description = "alo Sites public serving: renders published site pages to complete static HTML (and, from the service slice, serves them by Host)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
alo-store = { path = "../../../platform/alo-store" }
serde_json = { workspace = true }
tracing = { workspace = true }
# The service slice: the Host-resolving public server (`serve` module + the
# `alo-sites` binary).
axum = { workspace = true }
tokio = { workspace = true }
thiserror = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
# In-process integration tests: oneshot requests through the real router,
# fixtures written through the real store against the compose Postgres.
tower = { workspace = true }
sqlx = { workspace = true }

[lints]
workspace = true
